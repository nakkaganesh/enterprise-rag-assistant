[project]
name = "enterprise-rag-assistant"
version = "0.1.0"
description = "Production-style Advanced RAG assistant with hybrid retrieval, reranking, citations, and evaluation."
readme = "README.md"
authors = [
    { name = "Ganesh" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "unicorn>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "enterprise_rag"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
